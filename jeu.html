<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏄 Let's Surf - Édition Kraken</title>
    <link rel="stylesheet" href="jeu.css">
</head>
<body>
    <div id="title-screen">
        <h1>🌊 GROUPE1 🌊</h1>
        <p> l'ets surf</p>
        <button id="start-btn">🏄‍♂️ DÉMARRER LA VAGUE 🏄‍♂️</button>
        <button id="personalization-btn">⚙️ PERSONNALISATION</button>
    </div>

    <div id="personalization-modal">
        <h2>Personnalisation</h2>
        <label>Langue :</label>
        <select id="lang-select">
            <option value="fr">Français</option>
            <option value="en">English</option>
        </select>
        <label>Musique :</label>
        <select id="music-select">
            <option value="none">Aucune</option>
            <option value="music1">Musique 1</option>
            <option value="music2">Musique 2</option>
        </select>
        <button id="save-btn">Sauvegarder</button>
        <button id="close-btn">Fermer</button>
    </div>

    <div class="game-container" style="display: none;">
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="1000" height="600"></canvas>
        </div>
        <div class="info-panel">
            <div class="score-box">🏄 DISTANCE : <span id="distanceValue">0</span> m</div>
            <div class="score-box">⭐ SCORE : <span id="scoreValue">0</span></div>
            <div class="score-box">❤️ VIES : <span id="livesValue">3</span></div>
            <button id="pauseBtn">⏸️ PAUSE</button>
            <button id="restartButton">🔄 NOUVELLE VAGUE</button>
        </div>
        <div class="controls-hint">
            🎮 ← → ↑ ↓ pour se déplacer | 🌟 Évite REQUINS, ROCHERS & TORTUES | ⭐ ÉTOILES +10 | ❤️ CŒUR +1 VIE | 🐙 KRAKEN (5s)
        </div>
    </div>

    <audio id="music1" src="resources/audio/music1.mp3" loop preload="none"></audio>
    <audio id="music2" src="resources/audio/music2.mp3" loop preload="none"></audio>

    <script src="jeu.js"></script>
</body>
</html>
